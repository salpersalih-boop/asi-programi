<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><title>mobile test</title>
<style>body{margin:8px;font:12px monospace;background:#222;color:#0f0}iframe{border:2px solid #f90;background:#fff;vertical-align:top}pre{white-space:pre-wrap;color:#9f9}</style></head>
<body>
<pre id="out">running...</pre>
<div id="frames"></div>
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));
const WIDTHS = [[320,640],[360,740],[390,844],[430,900],[768,1000]];
const PAGES = ['dashboard','kanban','schedule','attendance','goals','notebook','books','pomodoro','settings'];
const result = {};
function audit(win) {
  const d = win.document, vw = d.documentElement.clientWidth, bad = [];
  d.querySelectorAll('body *').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width > 0 && el.offsetParent !== null && (r.right > vw + 1 || r.left < -1)) {
      // yatay kaydırılabilir kapsayıcı içindekiler sorun değil
      let p = el.parentElement, scroller = false;
      while (p && p !== d.body) { const o = win.getComputedStyle(p).overflowX; if ((o === 'auto' || o === 'scroll') && p.scrollWidth > p.clientWidth) { scroller = true; break; } p = p.parentElement; }
      if (!scroller) bad.push((el.id ? '#' + el.id : el.tagName.toLowerCase()) + '.' + String(el.className).split(' ')[0] + ' L' + Math.round(r.left) + ' R' + Math.round(r.right));
    }
  });
  return { vw, scrollW: d.documentElement.scrollWidth, overflow: d.documentElement.scrollWidth > vw + 1, bad: bad.slice(0, 8), badCount: bad.length };
}
function addBook(win, title, status, total) {
  win.ASI.books.openBookModal();
  const d = win.document;
  d.querySelector('#book-title').value = title;
  d.querySelector('#book-total-pages').value = total;
  d.querySelector('#book-status').value = status;
  d.querySelector('#book-form').requestSubmit();
}
(async () => {
  for (const [w, h] of WIDTHS) {
    const f = document.createElement('iframe');
    f.width = w; f.height = h; f.src = 'index.html';
    document.getElementById('frames').appendChild(f);
    await new Promise(r => f.onload = r);
    await sleep(2500);
    const win = f.contentWindow, d = win.document;
    d.querySelector('#splash-btn')?.click();
    await sleep(1500);
    const res = { pages: {} };
    for (const p of PAGES) {
      win.ASI.navigateTo(p); await sleep(500);
      res.pages[p] = audit(win);
    }
    // Kitaplık senaryosu
    win.ASI.navigateTo('books'); await sleep(400);
    const before = win.JSON.parse(win.localStorage.getItem('asi_books') || '[]').length;
    addBook(win, 'Test Kitap Bir (Okunacak) ' + w, 'to_read', 200); await sleep(500);
    addBook(win, 'Test Kitap Iki Cok Uzun Bir Kitap Adi Taşma Testi İçin Yazıldı ' + w, 'reading', 350); await sleep(500);
    addBook(win, 'Test Kitap Uc ' + w, 'to_read', 120); await sleep(500);
    const after = win.JSON.parse(win.localStorage.getItem('asi_books') || '[]').length;
    res.booksBefore = before; res.booksAfter = after; res.added = after - before;
    // Okunacak filtresi
    d.querySelector('.book-pill-btn[data-status="to_read"]').click(); await sleep(300);
    res.toReadCards = d.querySelectorAll('#book-grid .book-card').length;
    res.booksPageAfterAdd = audit(win);
    // modal Kaydet butonu görünürlüğü
    d.querySelector('#add-book-btn').click(); await sleep(400);
    const btn = d.querySelector('#book-form .modal-actions button[type=submit]');
    const br = btn.getBoundingClientRect();
    res.kaydet = { top: Math.round(br.top), bottom: Math.round(br.bottom), left: Math.round(br.left), right: Math.round(br.right), width: Math.round(br.width), height: Math.round(br.height), vh: win.innerHeight, vw: win.innerWidth, visible: br.top >= 0 && br.bottom <= win.innerHeight && br.left >= 0 && br.right <= win.innerWidth };
    res.modalAudit = audit(win);
    d.querySelector('#book-modal [data-modal]').click(); await sleep(200);
    // sayfa kaydetme / tamamlama
    const card = d.querySelector('#book-grid .book-card .quick-page-input');
    if (card) {
      const id = card.dataset.id;
      await win.ASI.books.updateQuickPage(id, 50); await sleep(200);
      const b1 = win.JSON.parse(win.localStorage.getItem('asi_books')).find(b => b.id === id);
      await win.ASI.books.updateQuickPage(id, b1.totalPages); await sleep(200);
      const b2 = win.JSON.parse(win.localStorage.getItem('asi_books')).find(b => b.id === id);
      await win.ASI.books.updateQuickPage(id, b2.totalPages - 1); await sleep(200);
      const b3 = win.JSON.parse(win.localStorage.getItem('asi_books')).find(b => b.id === id);
      res.flow = { afterPage50: b1.status + ' ' + b1.currentPage, afterLast: b2.status + ' ' + b2.currentPage + ' fin=' + b2.finishDate, afterRevert: b3.status + ' ' + b3.currentPage + ' fin=' + b3.finishDate };
      res.sessions = win.JSON.parse(win.localStorage.getItem('asi_reading_sessions') || '[]').length;
    }
    result[w + 'x' + h] = res;
    document.getElementById('out').textContent = 'done ' + w + '\n' + JSON.stringify(result, null, 1);
    win.ASI.navigateTo('books'); win.document.querySelector('.book-pill-btn[data-status="all"]').click();
  }
  document.getElementById('out').textContent = 'ALL DONE\n' + JSON.stringify(result, null, 1);
  window.__RESULT__ = result;
})();
</script></body></html>
